name: Build THE NOIZZ PASSAGE (VST3 & AU)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Windows x64 (VST3 & Standalone)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64 Environment (VS 2022 / VS 18+)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Windows x64 Release via Ninja + MSVC cl.exe)
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build VST3 & Standalone
        run: |
          cmake --build build --config Release --parallel 4

      - name: Bundle Factory IRs with Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_win/IRs | Out-Null
          $vst3 = Get-ChildItem -Path build -Directory -Filter "THE NOIZZ PASSAGE.vst3" -Recurse | Select-Object -First 1
          if ($null -eq $vst3) {
            Write-Error "Could not locate built THE NOIZZ PASSAGE.vst3 bundle"
            exit 1
          }
          Copy-Item -Path $vst3.FullName -Destination "dist_win/" -Recurse
          $exe = Get-ChildItem -Path build -File -Filter "THE NOIZZ PASSAGE.exe" -Recurse | Select-Object -First 1
          if ($null -ne $exe) {
            Copy-Item -Path $exe.FullName -Destination "dist_win/"
          }
          Copy-Item -Path "IRs/*.wav" -Destination "dist_win/IRs/"

      - name: Upload Windows x64 VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: THE-NOIZZ-PASSAGE-Windows-x64-VST3
          path: dist_win/

  build-macos-universal:
    name: macOS Universal (VST3 & AU)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (macOS Universal x86_64 + arm64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build VST3 & AU
        run: |
          cmake --build build --config Release --parallel 4

      - name: Bundle macOS VST3, AU & Factory IRs
        run: |
          mkdir -p dist_mac/VST3 dist_mac/AU dist_mac/IRs
          VST3_PATH=$(find build -name "THE NOIZZ PASSAGE.vst3" -type d | head -n 1)
          AU_PATH=$(find build -name "THE NOIZZ PASSAGE.component" -type d | head -n 1)
          cp -R "$VST3_PATH" dist_mac/VST3/
          cp -R "$AU_PATH" dist_mac/AU/
          cp IRs/*.wav dist_mac/IRs/

      - name: Upload macOS Universal VST3 & AU Artifact
        uses: actions/upload-artifact@v4
        with:
          name: THE-NOIZZ-PASSAGE-macOS-Universal-VST3-AU
          path: dist_mac/
